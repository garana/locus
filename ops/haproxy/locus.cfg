# HAProxy in front of locus-server: TLS ends here, and plain HTTP goes on
# to locus-server, which then stays on loopback (its default host,
# 127.0.0.1).
#
# Started by ops/haproxy/run.sh, which sets these variables:
#   LOCUS_TLS_CRT   the server certificate (PEM)
#   LOCUS_TLS_KEY   its private key (PEM)
#   LOCUS_TLS_BIND  where to listen, "addr:port[,addr:port...]"
#   LOCUS_UPSTREAM  locus-server's "addr:port"
#   LOCUS_TLS_PEM   only before HAProxy 3.0: the certificate and key in
#                   one file, which run.sh writes to a private temp dir

.if defined(LOCUS_TLS_PEM)
.else
# HAProxy 3.0 and later: the key is read where it is, never copied.
crt-store tls
    load crt "${LOCUS_TLS_CRT}" key "${LOCUS_TLS_KEY}" alias server
.endif

global
    log stdout format raw local0 info
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    # The request's headers and body: ample on a LAN, but a large
    # base64 image edit over a slow link may need more.
    timeout http-request 30s
    # An image, a video step or a long completion can take minutes
    # before its reply, or between two streamed chunks.
    timeout client 15m
    timeout server 15m
    # locus-server sees only this proxy's loopback connection, so its
    # own keepalive cannot find a client whose host died. These probes
    # do: such a client is dropped in about a minute (not after
    # timeout client), and its generation stops with it.
    option clitcpka
    clitcpka-idle 30s
    clitcpka-intvl 10s
    clitcpka-cnt 3

frontend locus_https
.if defined(LOCUS_TLS_PEM)
    bind "${LOCUS_TLS_BIND}" ssl crt "${LOCUS_TLS_PEM}" alpn http/1.1
.else
    bind "${LOCUS_TLS_BIND}" ssl crt "@tls/server" alpn http/1.1
.endif
    http-request set-header X-Forwarded-Proto https
    default_backend locus

backend locus
    option httpchk GET /health
    http-check expect status 200
    server locus "${LOCUS_UPSTREAM}" check inter 10s
