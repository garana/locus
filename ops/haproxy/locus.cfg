# HAProxy in front of locus-server: TLS ends here, and plain HTTP goes on
# to locus-server, which then stays on loopback (its default host,
# 127.0.0.1).
#
# Started by ops/haproxy/run.sh, which sets these variables:
#   LOCUS_TLS_CRT   the server certificate (PEM)
#   LOCUS_TLS_KEY   its private key (PEM), read in place, never copied
#   LOCUS_TLS_BIND  where to listen, "addr:port[,addr:port...]"
#   LOCUS_UPSTREAM  locus-server's "addr:port"

crt-store tls
    load crt "${LOCUS_TLS_CRT}" key "${LOCUS_TLS_KEY}" alias server

global
    log stdout format raw local0 info
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout http-request 30s
    # An image, a video step or a long completion can take minutes
    # before its reply, or between two streamed chunks.
    timeout client 15m
    timeout server 15m
    # Edit and vision requests carry base64 images in their bodies.
    option http-buffer-request

frontend locus_https
    bind "${LOCUS_TLS_BIND}" ssl crt "@tls/server" alpn http/1.1
    http-request set-header X-Forwarded-Proto https
    default_backend locus

backend locus
    server locus "${LOCUS_UPSTREAM}" check inter 10s
